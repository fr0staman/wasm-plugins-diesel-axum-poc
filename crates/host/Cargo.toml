[package]
name = "host"
edition.workspace = true
version.workspace = true

[[bin]]
name = "host"
path = "src/main.rs"

[dependencies]
wasmtime         = { workspace = true }
wasmtime-wasi    = { workspace = true }
diesel           = { workspace = true, features = ["chrono"] }
diesel-async     = { workspace = true, features = ["async-connection-wrapper"] }
diesel_migrations = "2"
chrono           = "0.4"
sqlparser        = { workspace = true }
tokio            = { workspace = true }
tokio-util       = { version = "0.7.19", default-features = false }
tracing          = { workspace = true }
tracing-subscriber = { workspace = true }
axum             = { workspace = true }
utoipa           = { workspace = true }
serde            = { workspace = true }
serde_json       = { workspace = true }
anyhow           = { workspace = true }
config           = { workspace = true }
matchit  = "0.8"
dotenvy  = "0.15.7"
futures-util = { workspace = true }
async-stream  = "0.3"
# v11 requires exactly one crypto provider feature, otherwise every sign/verify
# panics at runtime ("Could not automatically determine the process-level
# CryptoProvider"). rust_crypto keeps the build pure Rust; aws_lc_rs pulls C.
jsonwebtoken  = { version = "11", features = ["rust_crypto"] }
utoipa-axum = "0.2.0"
