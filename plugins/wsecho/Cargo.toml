[workspace]

[package]
name = "wsecho"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[package.metadata.component]
package = "myapp:wsecho"
target = { path = "../../wit" }

[dependencies]
wit-bindgen = { version = "0.57.1", features = ["async"] }
axum        = { version = "0.8.9", default-features = false }
utoipa      = { version = "5.5.0", features = ["axum_extras"] }
utoipa-axum = "0.2.0"
serde_json  = "1"

[profile.release]
lto = true
strip = true
opt-level = "z"
codegen-units = 1
panic = "abort"
