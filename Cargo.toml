[workspace]
resolver = "2"
members = [
    "crates/host",
    "crates/diesel-wasm-bridge",
]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
# Wasmtime
wasmtime         = { version = "44.0.1", features = ["component-model-async", "parallel-compilation"] }
wasmtime-wasi    = { version = "44.0.1", default-features = false, features = ["p2"] }

# Diesel / DB
diesel           = { version = "2.3.9", default-features = false, features = ["postgres_backend", "i-implement-a-third-party-backend-and-opt-into-breaking-changes"] }
diesel-async     = { version = "0.9.0", features = ["deadpool", "postgres"] }


# SQL validation
sqlparser         = { version = "0.62.0", features = ["visitor"] }
futures-util      = { version = "0.3.31", default-features = false }

# Async runtime
tokio            = { version = "1.52.3", features = ["rt-multi-thread", "macros"] }

# Tracing
tracing          = { version = "0.1.41" }
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }

# HTTP server
axum             = { version = "0.8", features = ["ws"] }

# OpenAPI
utoipa           = { version = "5.5.0", features = ["axum_extras", "chrono"] }

# Serialization
serde            = { version = "1", features = ["derive"] }
serde_json       = { version = "1" }

# Misc
anyhow           = { version = "1.0.98" }
dashmap          = { version = "6.1.0" }

config           = { version = "0.15.22", default-features = false }

[profile.release]
lto = "thin"
strip = true
opt-level = 3
codegen-units = 1
